{{< base}}
{{$content}}
<div class="container">
    <div class="card">
        <h1>{{blog.title}}</h1>
        <p class="post-meta">by {{owner.name}}</p>
        <p style="margin-bottom: 2rem;">{{blog.description}}</p>
        
        <div style="margin-bottom: 2rem;">
            <a href="/posts/new?blogId={{blog.id}}" class="btn">New Post</a>
            <a href="/blogs/{{blog.id}}/edit" class="btn">Edit Blog</a>
            <form style="display: inline;" method="POST" action="/blogs/{{blog.id}}/delete" onsubmit="return confirm('Are you sure you want to delete this blog and all its posts?');">
                <button type="submit" class="btn btn-danger">Delete Blog</button>
            </form>
        </div>
    </div>
    
    <div class="card">
        <h2>Posts</h2>
        
        {{#posts}}
        <div class="post">
            <h3>{{title}}</h3>
            <p class="post-meta">{{createdAt}}</p>
            <p>{{content}}</p>
            <div style="margin-top: 1rem;">
                <a href="/posts/{{id}}/edit" class="btn">Edit</a>
                <form style="display: inline;" method="POST" action="/posts/{{id}}/delete" onsubmit="return confirm('Are you sure you want to delete this post?');">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
        {{/posts}}
        
        {{^posts}}
        <p>No posts yet. Create your first post!</p>
        {{/posts}}
    </div>
</div>
{{/content}}
{{/ base}}
