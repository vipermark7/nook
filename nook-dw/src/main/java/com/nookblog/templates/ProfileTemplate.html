{{< base}}
{{$content}}
<div class="container">
    <div class="card">
        <h1>Your Profile</h1>
        
        <p><strong>Name:</strong> {{user.name}}</p>
        <p><strong>Email:</strong> {{user.email}}</p>
        
        {{#blog}}
        <div style="margin-top: 2rem;">
            <h2>Your Blog</h2>
            <p><strong>Title:</strong> {{title}}</p>
            <p><strong>Description:</strong> {{description}}</p>
            <a href="/blogs/{{id}}" class="btn">View Your Blog</a>
        </div>
        {{/blog}}
        
        {{^blog}}
        <div style="margin-top: 2rem;">
            <p>You haven't created a blog yet.</p>
            <a href="/blogs/new" class="btn">Create Your Blog</a>
        </div>
        {{/blog}}
    </div>
</div>
{{/content}}
{{/ base}}
